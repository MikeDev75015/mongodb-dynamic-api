version: 2.1
orbs:
  sonarcloud: sonarsource/sonarcloud@4.0.0
  slack: circleci/slack@4.12.6
  jq: circleci/jq@2.2.0
  docker: circleci/docker@2.6.0

executors:
  node:
    docker:
      - image: cimg/node:24.4.0
    resource_class: medium

aliases:
  - &install-deps
    run:
      name: Install dependencies
      command: npm ci
  - &audit-deps
    run:
      name: Audit dependencies
      command: npm audit --audit-level=high || true
  - &restore-cache
    restore_cache:
      keys:
        - dependency-cache-{{ checksum "package.json" }}
        - dependency-cache-
  - &save-cache
    save_cache:
      key: dependency-cache-{{ checksum "package.json" }}
      paths:
        - ./node_modules
  - &build-package
    run:
      name: Build
      command: npm run build
  - &update-npm-version
    run:
      name: Update NPM version
      command: 'sudo npm install -g npm@10'
  - &notify-fail
    slack/notify:
      event: fail
      template: basic_fail_1
  - &notify-success
    slack/notify:
      event: pass
      template: basic_success_1

commands:
  unit-tests-parallelized-command:
    description: "Split and run unit tests with JUnit as reporter"
    steps:
      - run:
          name: Create report folder
          command: mkdir -p reports/junit
      - run:
          name: Split and run unit tests
          command: |
            UT_FILES=$(circleci tests glob "libs/**/*.spec.ts" | circleci tests split --split-by=timings)
            echo $UT_FILES
            npm run test:ci:junit $UT_FILES
          environment:
            JEST_JUNIT_OUTPUT_DIR: reports/junit
      - store_test_results:
          path: reports/junit

  unit-tests-parallelized-sonar-command:
    description: "Split and run unit tests with Sonar reporter, per-node coverage and XML"
    steps:
      - run:
          name: Create report folders
          command: mkdir -p reports/sonar/node-${CIRCLE_NODE_INDEX} coverage-data/node-${CIRCLE_NODE_INDEX}
      - run:
          name: Split and run unit tests with Sonar reporter
          command: |
            UT_FILES=$(circleci tests glob "libs/**/*.spec.ts" | circleci tests split --split-by=timings)
            echo $UT_FILES
            npm run test:ci:sonar -- $UT_FILES --coverageDirectory=../coverage-data/node-${CIRCLE_NODE_INDEX}
      - run:
          name: Move Sonar XML report to node-specific folder
          command: |
            if [ -f reports/sonar/test-report.xml ]; then
              mv reports/sonar/test-report.xml reports/sonar/node-${CIRCLE_NODE_INDEX}/test-report.xml
            fi
      - persist_to_workspace:
          root: .
          paths:
            - coverage-data
            - reports/sonar

  e2e-tests-parallelized-command:
    description: "Split and run E2E tests with JUnit reporter"
    steps:
      - run:
          name: Create report folder
          command: mkdir -p reports/junit
      - run:
          name: Split and run E2E tests
          command: |
            E2E_FILES=$(circleci tests glob "libs/**/*.e2e-spec.ts" | circleci tests split --split-by=timings)
            echo "Running E2E files on node ${CIRCLE_NODE_INDEX}:"
            echo $E2E_FILES
            npm run test-e2e:ci -- --testResultsProcessor=jest-junit $E2E_FILES
          environment:
            JEST_JUNIT_OUTPUT_DIR: reports/junit
      - store_test_results:
          path: reports/junit

  merge-coverage-command:
    description: "Merge all per-node LCOV and Sonar XML reports into single files"
    steps:
      - run:
          name: Merge LCOV coverage reports
          command: npx lcov-result-merger 'coverage-data/*/lcov.info' reports/sonar/lcov.info
      - run:
          name: Merge Sonar XML test reports
          command: |
            echo '<?xml version="1.0" encoding="UTF-8"?>' > reports/sonar/merged-test-report.xml
            echo '<testExecutions version="1">' >> reports/sonar/merged-test-report.xml
            for f in reports/sonar/node-*/test-report.xml; do
              grep -vE '(<\?xml|testExecutions)' "$f" >> reports/sonar/merged-test-report.xml
            done
            echo '</testExecutions>' >> reports/sonar/merged-test-report.xml
      - store_artifacts:
          path: reports/sonar
          destination: reports/sonar

  git-config-local-user-command:
    description: "Configure the default identity for the git account"
    steps:
      - run: git config credential.helper 'cache --timeout=120'
      - run: git config user.email ${USER_EMAIL}
      - run: git config user.name ${USER_NAME}

  delete-tag-command:
    description: "Delete the tag from the repository"
    parameters:
      tag:
        type: string
    steps:
      - run:
          name: Delete the tag from the repository
          command: git push -d -q https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git << parameters.tag >>

  install-github-cli-command:
    description: "Installs the latest Github CLI version"
    steps:
      - jq/install
      - run:
          name: Install Github CLI
          command: |
            LATEST_RELEASE=$(curl -s https://api.github.com/repos/cli/cli/releases/latest)
            VERSION=$(echo $LATEST_RELEASE | jq -r '.tag_name')
            DEB_URL=$(echo $LATEST_RELEASE | jq -r '.assets[].browser_download_url | select(. | contains("linux_amd64.deb"))')
            wget --quiet -O gh_latest.deb $DEB_URL
            sudo apt install ./gh_latest.deb
          description: Gets latest release version of Github CLI

  create-release-pr-command:
    description: "Create release or prerelease PR to develop on Github"
    parameters:
      branch:
        type: string
    steps:
      - run:
          name: Create the auto-<< parameters.branch >> branch
          command: git checkout -q -b auto-<< parameters.branch >>
      - run:
          name: Push the auto-<< parameters.branch >> branch on remote
          command: git push -q https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git auto-<< parameters.branch >>
      - run:
          name: Prepare auto-<< parameters.branch >> with release-it
          command: npm run auto-<< parameters.branch >>
      - run:
          name: Create the PR on Github
          command: |
            VERSION_NUMBER=v$(jq -r '.version' package.json)
            echo ${VERSION_NUMBER}
            gh pr create -R ${GH_OWNER}/${GH_REPO} -H auto-<< parameters.branch >> -B develop --fill-verbose -t "<< parameters.branch >> ${VERSION_NUMBER} created automatically from CircleCI"

  merge-release-pr-command:
    description: "Merge the release PR and automatically delete the branch"
    parameters:
      branch:
        type: string
    steps:
      - run:
          name: Merge the PR and automatically delete the << parameters.branch >> branch
          command: gh pr merge << parameters.branch >> -R ${GH_OWNER}/${GH_REPO} --auto -r -d

  create-develop-pr-command:
    description: "Run release-it, push release commit to develop and create PR to main on Github"
    steps:
      - run:
          name: Checkout to develop
          command: git checkout develop
      - run:
          name: Pull develop
          command: git pull https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git develop
      - run:
          name: Run release-it to prepare release commit
          command: npm run auto-release
      - run:
          name: Push release commit to develop
          command: git push https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git develop
      - run:
          name: Create a pull request from develop to main
          command: |
            VERSION_NUMBER=v$(jq -r '.version' package.json)
            echo ${VERSION_NUMBER}
            gh pr create -R ${GH_OWNER}/${GH_REPO} -H develop -B main --fill-verbose -t "New ${VERSION_NUMBER} created automatically from CircleCI"

  create-version-tags-command:
    description: "Create and push the version tags"
    steps:
      - run:
          name: Checkout to main
          command: git checkout main
      - run:
          name: Pull main
          command: git pull https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git main
      - run:
          name: Create the release / prerelease version tags
          command: |
            VERSION_NUMBER=v$(jq -r '.version' package.json)
            echo ${VERSION_NUMBER}
            git tag ${VERSION_NUMBER}
            git push https://${GH_TOKEN}@github.com/${GH_OWNER}/${GH_REPO}.git ${VERSION_NUMBER}

  copy-files-command:
    description: "Copy all the required files to dist directory"
    steps:
      - run:
          name: Copy README.md to dist
          command: cp -rf README.md dist
      - run:
          name: Copy CHANGELOG.md to dist
          command: cp -rf CHANGELOG.md dist
      - run:
          name: Copy LICENSE to dist
          command: cp -rf LICENSE dist
      - run:
          name: Copy package.json to dist
          command: cp -rf package.json dist
      - run:
          name: Strip the "prepare" script from dist/package.json
          command: |
            # `npm publish ./dist` re-runs npm lifecycle scripts against dist/package.json (a
            # verbatim copy of the root one) with dist/ itself as the working context — but the
            # build already ran, correctly, as its own earlier step (*build-package) from the repo
            # root. Re-running "prepare" (-> "build") from inside dist/ breaks: `tsc` alone still
            # finds tsconfig.json by walking up to the repo root, but `tsc -p tsconfig.schematics.json`
            # resolves that path relative to cwd (dist/), where it doesn't exist (TS5058). Since the
            # published package is already fully built, it never needs "prepare" to fire at all.
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('dist/package.json', 'utf8'));
              delete pkg.scripts.prepare;
              fs.writeFileSync('dist/package.json', JSON.stringify(pkg, null, 2) + '\n');
            "

  publish-npm-command:
    description: "Authenticate to npm account and publish new version"
    parameters:
      branch:
        type: string
    steps:
      - run:
          name: NPM Account Authentication
          command: echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
      - run:
          name: Publish << parameters.branch >> on npm
          command: npm run publish-<< parameters.branch >>

jobs:
  dependencies-job:
    description: "Install dependencies, update cache"
    executor: node
    steps:
      - checkout
      - *update-npm-version
      - *restore-cache
      - *install-deps
      - *audit-deps
      - *save-cache

  build-job:
    executor: node
    parameters:
      persist:
        type: boolean
        default: false
    steps:
      - checkout
      - *restore-cache
      - *build-package
      - *notify-fail
      - *notify-success

  test-job:
    executor: node
    parallelism: 8
    steps:
      - checkout
      - *restore-cache
      - unit-tests-parallelized-command
      - *notify-fail
      - *notify-success

  test-with-coverage-job:
    executor: node
    parallelism: 8
    steps:
      - checkout
      - *restore-cache
      - unit-tests-parallelized-sonar-command
      - *notify-fail
      - *notify-success

  merge-and-sonarcloud-job:
    executor: node
    steps:
      - checkout
      - *restore-cache
      - attach_workspace:
          at: .
      - merge-coverage-command
      - sonarcloud/scan
      - *notify-fail
      - *notify-success

  e2e-tests-mongodb-job:
    # A plain `mongo:latest` sidecar (the previous setup) can't run as a replica set: it needs a
    # keyFile once --auth is combined with --replSet (required for MongoDB transactions — see
    # helpers/mongo-transaction.helper.ts), and CircleCI's docker executor has no way to inject a
    # file into a sidecar image's filesystem (no volumes/custom entrypoints, only `command`).
    # `machine` gives this job a real Docker daemon, so it can run the exact same
    # `docker compose up` (compose.yaml) already verified locally — same auth+replSet+keyFile
    # setup in both places, one less thing to keep in sync.
    machine:
      image: ubuntu-2204:current
    resource_class: medium
    parallelism: 4
    environment:
      # Matches compose.yaml's port (27018, not the Mongo default 27017 — see compose.yaml for
      # why) and dam-user/dam-db credentials/dbOwner role (created by mongo-init.js).
      MONGO_DB_URL: mongodb://dam-user:dam-pass@localhost:27018/dam-db?retryWrites=true&w=majority
      # mongodb-memory-server (used by testing/create-dynamic-api-testing-app.e2e-spec.ts) caches
      # its downloaded mongod binary under node_modules/.cache by default — which is exactly what
      # *restore-cache restores from a previous run. A binary that was ever interrupted mid-download
      # there (a cancelled job, a network blip) would poison every later run sharing that cache key,
      # silently reusing a corrupt binary instead of re-downloading a good one. Redirecting the
      # download dir outside node_modules keeps it on this job's own ephemeral `machine` VM, so it's
      # always either a full fresh download or a good binary from earlier in the same run — never a
      # stale one smuggled in via the node_modules cache.
      MONGOMS_DOWNLOAD_DIR: /tmp/mongodb-binaries
    steps:
      - checkout
      - *restore-cache
      - run:
          name: Install Node.js (machine executor doesn't ship the cimg/node-pinned version)
          command: |
            curl -fsSL https://deb.nodesource.com/setup_24.x | sudo -E bash -
            sudo apt-get install -y nodejs
            node --version
            npm --version
      - run:
          name: Start MongoDB (replica set, via docker compose)
          command: |
            docker compose version
            docker compose up -d
      - run:
          name: Wait for the MongoDB replica set to become healthy
          command: |
            for i in $(seq 1 30); do
              status=$(docker inspect mongodb-test --format '{{.State.Health.Status}}' 2>/dev/null || echo starting)
              if [ "$status" = "healthy" ]; then
                echo "MongoDB is healthy"
                exit 0
              fi
              sleep 2
            done
            echo "MongoDB did not become healthy in time"
            docker logs mongodb-test
            exit 1
      - run:
          name: Clear any cached mongodb-memory-server binary
          command: |
            # *restore-cache above restores node_modules from a previous run — including
            # node_modules/.cache/mongodb-memory-server if `npm ci`'s postinstall populated it
            # (mongodb-memory-server-core prefers that path over MONGOMS_DOWNLOAD_DIR whenever it
            # already contains a binary — see DryMongoBinary.generateDownloadPath's "does it exist"
            # checks, which run before "where should a fresh download go"). A binary that was ever
            # interrupted mid-download there (a cancelled job, a network blip) would silently poison
            # every later run sharing that cache key. Clearing it here guarantees
            # MONGOMS_DOWNLOAD_DIR (set on this job, pointing outside node_modules) is always the
            # one actually used, so it's either a full fresh download or a binary already verified
            # good earlier in this same run — never a stale one smuggled in via the node_modules cache.
            rm -rf node_modules/.cache/mongodb-memory-server
      - e2e-tests-parallelized-command
      - *notify-fail
      - *notify-success

  merge-release-pr-job:
    executor: node
    parameters:
      branch:
        type: string
    steps:
      - checkout
      - *restore-cache
      - git-config-local-user-command
      - install-github-cli-command
      - merge-release-pr-command:
          branch: << parameters.branch >>
      - *notify-fail
      - *notify-success

  create-develop-pr-job:
    executor: node
    steps:
      - checkout
      - *restore-cache
      - git-config-local-user-command
      - install-github-cli-command
      - create-develop-pr-command
      - *notify-fail
      - *notify-success

  create-version-tags-job:
    executor: node
    steps:
      - checkout
      - git-config-local-user-command
      - install-github-cli-command
      - create-version-tags-command
      - *notify-fail
      - *notify-success

  publish-release-job:
    executor: node
    parameters:
      branch:
        type: string
    steps:
      - checkout
      - *restore-cache
      - *build-package
      - copy-files-command
      - publish-npm-command:
          branch: << parameters.branch >>
      - *notify-fail
      - *notify-success

workflows:
  ci-default-workflow:
    when:
      not: << pipeline.git.tag >>
    jobs:
      - dependencies-job:
          filters:
            branches:
              ignore:
                - main
                - develop
                - auto-prerelease
                - auto-release
      - build-job:
          requires:
            - dependencies-job
          context: SLACK
          filters:
            branches:
              ignore:
                - main
                - develop
                - auto-prerelease
                - auto-release
      - test-job:
          requires:
            - dependencies-job
          context: SLACK
          filters:
            branches:
              ignore:
                - main
                - develop
                - auto-prerelease
                - auto-release

  ci-develop-workflow:
    when:
      equal: [ << pipeline.git.branch >>, develop ]
    jobs:
      - dependencies-job:
          filters:
            branches:
              only: develop
      - test-with-coverage-job:
          requires:
            - dependencies-job
          context:
            - SLACK
          filters:
            branches:
              only: develop
      - merge-and-sonarcloud-job:
          requires:
            - test-with-coverage-job
          context:
            - SONARCLOUD
            - SLACK
          filters:
            branches:
              only: develop
      - e2e-tests-mongodb-job:
          requires:
            - dependencies-job
          context:
            - SLACK
          filters:
            branches:
              only: develop

  cd-develop-pr-workflow:
    when:
      equal: [ << pipeline.git.branch >>, develop ]
    jobs:
      - confirm-develop-pr-job:
          type: approval
          filters:
            branches:
              only: develop
      - create-develop-pr-job:
          requires:
            - confirm-develop-pr-job
          context:
            - SONARCLOUD
            - GIT
            - SLACK
          filters:
            branches:
              only: develop

  ci-main-workflow:
    when:
      equal: [ << pipeline.git.branch >>, main ]
    jobs:
      - dependencies-job:
          filters:
            branches:
              only: main
      - create-version-tags-job:
          requires:
            - dependencies-job
          context:
            - GIT
            - SLACK
          filters:
            branches:
              only: main
      - test-with-coverage-job:
          requires:
            - dependencies-job
          context:
            - SLACK
          filters:
            branches:
              only: main
      - merge-and-sonarcloud-job:
          requires:
            - test-with-coverage-job
          context:
            - SONARCLOUD
            - SLACK
          filters:
            branches:
              only: main

  cd-prerelease-version-workflow:
    when:
      matches:
        pattern: /^v\d+\.\d+\.\d+\-beta\.\d+$/
        value: << pipeline.git.tag >>
    jobs:
      - dependencies-job:
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+\-beta\.\d+$/
      - publish-release-job:
          name: publish-prerelease-job
          requires:
            - dependencies-job
          branch: prerelease
          context:
            - GIT
            - SLACK
            - NPM
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+\-beta\.\d+$/

  cd-release-version-workflow:
    when:
      matches:
        pattern: /^v\d+\.\d+\.\d+$/
        value: << pipeline.git.tag >>
    jobs:
      - dependencies-job:
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+$/
      - publish-release-job:
          requires:
            - dependencies-job
          branch: release
          context:
            - GIT
            - SLACK
            - NPM
          filters:
            branches:
              ignore: /.*/
            tags:
              only:
                - /^v\d+\.\d+\.\d+$/
